openapi: 3.0.3
info:
  title: individuals-api
  description: |
    Внешний входной слой платформы: регистрация, вход, обновление токена и получение текущего пользователя.
    individuals-api оркестрирует person-service (доменный пользователь, `userId`) и Keycloak
    (учётная запись и токены) и сам доменных данных не хранит.

    Поле `error` в `ErrorResponse` содержит код бизнес-ошибки:
    `VALIDATION_ERROR`, `PASSWORD_MISMATCH`, `UNAUTHORIZED`, `FORBIDDEN`, `INVALID_CREDENTIALS`,
    `INVALID_REFRESH_TOKEN`, `CONFLICT`, `REGISTRATION_INCONSISTENT`, `EXTERNAL_SERVICE_ERROR`,
    `EXTERNAL_SERVICE_UNAVAILABLE`, `INTERNAL_ERROR`. Ошибки фреймворка (404, 405, 415) возвращаются
    в том же формате с названием HTTP-статуса в `error`.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Локальный запуск
tags:
  - name: auth
    description: Регистрация и аутентификация
paths:
  /api/v1/auth/registration:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация нового пользователя
      description: |
        Создаёт доменного пользователя в person-service, затем учётную запись в Keycloak
        с атрибутом `user_uid`, выполняет вход и возвращает токены.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: user@example.com
              password: Str@ngPass!
              confirmPassword: Str@ngPass!
              firstName: Ivan
              lastName: Ivanov
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                userId: 3d6f3532-8b97-4c7b-8a2a-608b6aeb3a7e
                accessToken: <jwt>
                refreshToken: <jwt>
                expiresIn: 300
                tokenType: Bearer
        '400':
          description: Некорректный запрос или пароли не совпадают
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    timestamp: '2026-06-08T10:15:30Z'
                    path: /api/v1/auth/registration
                    status: 400
                    error: VALIDATION_ERROR
                    message: Ошибка валидации запроса
                    traceId: 803b448a0489f84084905d3093480352
                    details:
                      - 'email: должно иметь формат адреса электронной почты'
                passwordMismatch:
                  value:
                    timestamp: '2026-06-08T10:15:30Z'
                    path: /api/v1/auth/registration
                    status: 400
                    error: PASSWORD_MISMATCH
                    message: Пароль и подтверждение не совпадают
                    traceId: 803b448a0489f84084905d3093480352
                    details: []
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-06-08T10:15:30Z'
                path: /api/v1/auth/registration
                status: 409
                error: CONFLICT
                message: Пользователь с таким email уже существует
                traceId: 803b448a0489f84084905d3093480352
                details: []
        '502':
          description: |
            `REGISTRATION_INCONSISTENT` — доменный пользователь создан, но регистрация в Keycloak
            не завершилась (несогласованная регистрация). Частичный сбой не скрывается.
            `EXTERNAL_SERVICE_ERROR` — person-service ответил неожиданной ошибкой, пользователь не создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                registrationInconsistent:
                  value:
                    timestamp: '2026-06-08T10:15:30Z'
                    path: /api/v1/auth/registration
                    status: 502
                    error: REGISTRATION_INCONSISTENT
                    message: Регистрация завершилась частично, обратитесь в поддержку
                    traceId: 803b448a0489f84084905d3093480352
                    details:
                      - 'userId: 3d6f3532-8b97-4c7b-8a2a-608b6aeb3a7e'
                externalServiceError:
                  value:
                    timestamp: '2026-06-08T10:15:30Z'
                    path: /api/v1/auth/registration
                    status: 502
                    error: EXTERNAL_SERVICE_ERROR
                    message: Внешний сервис вернул ошибку
                    traceId: 803b448a0489f84084905d3093480352
                    details:
                      - 'service: person-service'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по email и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: Str@ngPass!
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                userId: 3d6f3532-8b97-4c7b-8a2a-608b6aeb3a7e
                accessToken: <jwt>
                refreshToken: <jwt>
                expiresIn: 300
                tokenType: Bearer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-06-08T10:15:30Z'
                path: /api/v1/auth/login
                status: 401
                error: INVALID_CREDENTIALS
                message: Неверный email или пароль
                traceId: 803b448a0489f84084905d3093480352
                details: []
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh-token:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Обновление токена доступа
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: <jwt>
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                userId: 3d6f3532-8b97-4c7b-8a2a-608b6aeb3a7e
                accessToken: <jwt>
                refreshToken: <jwt>
                expiresIn: 300
                tokenType: Bearer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token недействителен или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-06-08T10:15:30Z'
                path: /api/v1/auth/refresh-token
                status: 401
                error: INVALID_REFRESH_TOKEN
                message: Refresh token недействителен или истёк
                traceId: 803b448a0489f84084905d3093480352
                details: []
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Получение текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              example:
                userId: 3d6f3532-8b97-4c7b-8a2a-608b6aeb3a7e
                keycloakUserId: 6d4a6249-75d8-4b8d-aee8-c2f6ddafaa11
                email: user@example.com
                firstName: Ivan
                lastName: Ivanov
                roles: [USER]
                emailVerified: false
        '401':
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-06-08T10:15:30Z'
                path: /api/v1/auth/me
                status: 401
                error: UNAUTHORIZED
                message: Требуется аутентификация
                traceId: 803b448a0489f84084905d3093480352
                details: []
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-08T10:15:30Z'
            path: /api/v1/auth/login
            status: 400
            error: VALIDATION_ERROR
            message: Ошибка валидации запроса
            traceId: 803b448a0489f84084905d3093480352
            details:
              - 'password: не должно быть пустым'
    ServiceUnavailable:
      description: Внешний сервис (Keycloak или person-service) недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-08T10:15:30Z'
            path: /api/v1/auth/login
            status: 503
            error: EXTERNAL_SERVICE_UNAVAILABLE
            message: Внешний сервис временно недоступен
            traceId: 803b448a0489f84084905d3093480352
            details: []
    BadGateway:
      description: Keycloak ответил неожиданной ошибкой
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-08T10:15:30Z'
            path: /api/v1/auth/login
            status: 502
            error: EXTERNAL_SERVICE_ERROR
            message: Внешний сервис вернул ошибку
            traceId: 803b448a0489f84084905d3093480352
            details:
              - 'service: keycloak'
    InternalError:
      description: Непредвиденная ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-06-08T10:15:30Z'
            path: /api/v1/auth/login
            status: 500
            error: INTERNAL_ERROR
            message: Внутренняя ошибка сервиса
            traceId: 803b448a0489f84084905d3093480352
            details: []
  schemas:
    RegistrationRequest:
      type: object
      required: [email, password, confirmPassword, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Не длиннее, чем допускает профиль пользователя Keycloak (length.max = 255)
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 64
        lastName:
          type: string
          minLength: 1
          maxLength: 64
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required: [userId, accessToken, refreshToken, expiresIn, tokenType]
      properties:
        userId:
          type: string
          format: uuid
          description: Доменный идентификатор пользователя (user_uid)
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Срок жизни access token в секундах
        tokenType:
          type: string
          example: Bearer
    CurrentUserResponse:
      type: object
      required: [userId, keycloakUserId, email, roles, emailVerified]
      properties:
        userId:
          type: string
          format: uuid
        keycloakUserId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string
        emailVerified:
          type: boolean
    ErrorResponse:
      type: object
      description: Единая схема ошибки для всех сервисов платформы
      required: [timestamp, path, status, error, message, traceId]
      properties:
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        status:
          type: integer
        error:
          type: string
          description: Код бизнес-ошибки
        message:
          type: string
        traceId:
          type: string
        details:
          type: array
          items:
            type: string
