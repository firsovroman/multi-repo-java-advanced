spring:
  http:
    serviceclient:
      person-service:
        base-url: http://person-service-stub:8080

app:
  keycloak:
    server-url: http://keycloak:8080
    # Keycloak запущен с KC_HOSTNAME=http://localhost:8080, поэтому issuer в токенах — внешний адрес
    issuer-uri: http://localhost:8080/realms/payment-platform

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
