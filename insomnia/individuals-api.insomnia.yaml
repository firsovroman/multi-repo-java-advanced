type: collection.insomnia.rest/5.0
name: individuals-api
meta:
  id: wrk_individuals_api
  created: 1761436800000
  modified: 1761436800000
  description: "Ручная проверка сценариев individuals-api. Запуск стенда: см. README.md. Регистрация и вход сохраняют токены в переменные окружения."
collection:
  - name: 1. Registration
    meta:
      id: req_registration
      created: 1761436800000
      modified: 1761436800000
      sortKey: -1000
    method: POST
    url: "{{ _.baseUrl }}/api/v1/auth/registration"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "email": "{{ _.email }}",
          "password": "{{ _.password }}",
          "confirmPassword": "{{ _.password }}",
          "firstName": "Ivan",
          "lastName": "Ivanov"
        }
    scripts:
      preRequest: |-
        if (!insomnia.baseEnvironment.get('email')) {
          insomnia.baseEnvironment.set('email', 'user-' + Date.now() + '@example.com');
        }
      afterResponse: |-
        insomnia.test('201 Created', () => insomnia.expect(insomnia.response.code).to.eql(201));
        const body = insomnia.response.json();
        insomnia.test('userId и токены', () => {
          insomnia.expect(body.userId).to.be.a('string');
          insomnia.expect(body.accessToken).to.be.a('string');
          insomnia.expect(body.tokenType).to.eql('Bearer');
        });
        insomnia.baseEnvironment.set('userUid', body.userId);
        insomnia.baseEnvironment.set('accessToken', body.accessToken);
        insomnia.baseEnvironment.set('refreshToken', body.refreshToken);
  - name: 2. Login
    meta:
      id: req_login
      created: 1761436800000
      modified: 1761436800000
      sortKey: -900
    method: POST
    url: "{{ _.baseUrl }}/api/v1/auth/login"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "email": "{{ _.email }}",
          "password": "{{ _.password }}"
        }
    scripts:
      afterResponse: |-
        insomnia.test('200 OK', () => insomnia.expect(insomnia.response.code).to.eql(200));
        const body = insomnia.response.json();
        insomnia.test('тот же userId', () => insomnia.expect(body.userId).to.eql(insomnia.baseEnvironment.get('userUid')));
        insomnia.baseEnvironment.set('accessToken', body.accessToken);
        insomnia.baseEnvironment.set('refreshToken', body.refreshToken);
  - name: 3. Refresh token
    meta:
      id: req_refresh_token
      created: 1761436800000
      modified: 1761436800000
      sortKey: -800
    method: POST
    url: "{{ _.baseUrl }}/api/v1/auth/refresh-token"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |-
        {
          "refreshToken": "{{ _.refreshToken }}"
        }
    scripts:
      afterResponse: |-
        insomnia.test('200 OK', () => insomnia.expect(insomnia.response.code).to.eql(200));
        const body = insomnia.response.json();
        insomnia.baseEnvironment.set('accessToken', body.accessToken);
        insomnia.baseEnvironment.set('refreshToken', body.refreshToken);
  - name: 4. Me
    meta:
      id: req_me
      created: 1761436800000
      modified: 1761436800000
      sortKey: -700
    method: GET
    url: "{{ _.baseUrl }}/api/v1/auth/me"
    authentication:
      type: bearer
      token: "{{ _.accessToken }}"
    scripts:
      afterResponse: |-
        insomnia.test('200 OK', () => insomnia.expect(insomnia.response.code).to.eql(200));
        const body = insomnia.response.json();
        insomnia.test('userId из токена', () => insomnia.expect(body.userId).to.eql(insomnia.baseEnvironment.get('userUid')));
        insomnia.test('роль USER', () => insomnia.expect(body.roles).to.include('USER'));
  - name: Errors
    meta:
      id: fld_errors
      created: 1761436800000
      modified: 1761436800000
      sortKey: -600
    children:
      - name: "Registration: пароли не совпадают (400)"
        meta:
          id: req_err_password_mismatch
          created: 1761436800000
          modified: 1761436800000
          sortKey: -1000
        method: POST
        url: "{{ _.baseUrl }}/api/v1/auth/registration"
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "email": "mismatch@example.com",
              "password": "Str@ngPass!",
              "confirmPassword": "Other@Pass1",
              "firstName": "Ivan",
              "lastName": "Ivanov"
            }
        scripts:
          afterResponse: |-
            insomnia.test('400 PASSWORD_MISMATCH', () => {
              insomnia.expect(insomnia.response.code).to.eql(400);
              insomnia.expect(insomnia.response.json().error).to.eql('PASSWORD_MISMATCH');
            });
      - name: "Registration: email занят (409)"
        meta:
          id: req_err_email_taken
          created: 1761436800000
          modified: 1761436800000
          sortKey: -900
        method: POST
        url: "{{ _.baseUrl }}/api/v1/auth/registration"
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "email": "taken@example.com",
              "password": "Str@ngPass!",
              "confirmPassword": "Str@ngPass!",
              "firstName": "Ivan",
              "lastName": "Ivanov"
            }
        scripts:
          afterResponse: |-
            insomnia.test('409 CONFLICT', () => {
              insomnia.expect(insomnia.response.code).to.eql(409);
              insomnia.expect(insomnia.response.json().error).to.eql('CONFLICT');
            });
      - name: "Login: неверный пароль (401)"
        meta:
          id: req_err_invalid_credentials
          created: 1761436800000
          modified: 1761436800000
          sortKey: -800
        method: POST
        url: "{{ _.baseUrl }}/api/v1/auth/login"
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: |-
            {
              "email": "{{ _.email }}",
              "password": "wrong-password"
            }
        scripts:
          afterResponse: |-
            insomnia.test('401 INVALID_CREDENTIALS', () => {
              insomnia.expect(insomnia.response.code).to.eql(401);
              insomnia.expect(insomnia.response.json().error).to.eql('INVALID_CREDENTIALS');
            });
      - name: "Me: без токена (401)"
        meta:
          id: req_err_unauthorized
          created: 1761436800000
          modified: 1761436800000
          sortKey: -700
        method: GET
        url: "{{ _.baseUrl }}/api/v1/auth/me"
        scripts:
          afterResponse: |-
            insomnia.test('401 UNAUTHORIZED', () => {
              insomnia.expect(insomnia.response.code).to.eql(401);
              insomnia.expect(insomnia.response.json().error).to.eql('UNAUTHORIZED');
            });
  - name: Actuator
    meta:
      id: fld_actuator
      created: 1761436800000
      modified: 1761436800000
      sortKey: -500
    children:
      - name: Health
        meta:
          id: req_actuator_health
          created: 1761436800000
          modified: 1761436800000
          sortKey: -1000
        method: GET
        url: "{{ _.baseUrl }}/actuator/health"
      - name: Prometheus
        meta:
          id: req_actuator_prometheus
          created: 1761436800000
          modified: 1761436800000
          sortKey: -900
        method: GET
        url: "{{ _.baseUrl }}/actuator/prometheus"
environments:
  name: Base Environment
  meta:
    id: env_individuals_api_base
    created: 1761436800000
    modified: 1761436800000
    isPrivate: false
  data:
    baseUrl: http://localhost:8081
    email: ""
    password: Str@ngPass!
    accessToken: ""
    refreshToken: ""
    userUid: ""
